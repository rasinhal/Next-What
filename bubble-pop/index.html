<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2a4a">
  <title>Bubble Pop</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <video id="cam" playsinline muted></video>
  <canvas id="stage"></canvas>

  <div id="hud" hidden>
    <div class="pill" id="score">0</div>
    <div class="pill" id="timer">60</div>
  </div>
  <div id="debug" hidden></div>
  <div id="hint" hidden></div>

  <section id="menu" class="panel">
    <h1>Bubble Pop</h1>
    <p class="lead">Stand back so the camera sees your whole body, then pop bubbles with your hands.</p>

    <fieldset>
      <legend>Who is playing?</legend>
      <div class="choices" id="level">
        <button type="button" data-level="little">Little kids<small>3 to 6</small></button>
        <button type="button" data-level="kids" class="on">Kids<small>7 to 12</small></button>
        <button type="button" data-level="big">Teens and adults<small>13+</small></button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Players</legend>
      <div class="choices" id="players">
        <button type="button" data-players="1" class="on">1 player</button>
        <button type="button" data-players="2">2 players</button>
      </div>
    </fieldset>

    <label class="check"><input type="checkbox" id="showDebug"> Show tracking info (speed test)</label>

    <button type="button" id="start" class="big">Start</button>
    <p class="fine">Video stays on this device. Nothing is recorded or uploaded.</p>
  </section>

  <section id="loading" class="panel" hidden>
    <h2 id="loadingText">Starting the camera...</h2>
  </section>

  <section id="over" class="panel" hidden>
    <h2>Time's up!</h2>
    <p class="result"><span id="final">0</span> bubbles popped</p>
    <div class="row">
      <button type="button" id="again" class="big">Play again</button>
      <button type="button" id="toMenu">Menu</button>
    </div>
  </section>

  <section id="error" class="panel" hidden>
    <h2>Something went wrong</h2>
    <p id="errorText"></p>
    <button type="button" id="retry">Back to menu</button>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
